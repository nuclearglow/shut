[package]
name = "shut"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
authors = ["nuky <svenvowe@gmail.com>"]
description = "A minimal CLI tool to kill a process listening on a port."
keywords = ["cli", "system", "process", "port", "pid"]
categories = ["command-line-utilities"]
repository = "https://github.com/nuclearglow/shut"
readme = "README.md"
license = "MIT"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
name = "shut"
path = "src/lib.rs"

[[bin]]
name = "shut"
path = "src/main.rs"

[dependencies]
env_logger = "0.11"
exitcode = "1.1"
log = "0.4"
netstat2 = "0.11"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
